# DeepSeek Harness profile layer for WenYuan memory.
#
# `dsh plugin --profile <name> add wenyuan-coding-agents` installs this package into the profile
# and — because package.json declares `dsh.bundle.patch` — appends this file to the profile's
# ordered bundle list. Nothing else needs editing: the row below mounts on the host plane, where
# the pre-step/session-start/turn-stopping events and the layered tools registry all reach every
# session, including the Web surface's per-session agent presets.
#
# Memory itself is configured OUTSIDE dsh, in ~/.wenyuan/config.json (server URL, token, bank
# naming, opt-outs) — the same file every other WenYuan coding-agent harness reads. To turn it off
# for one profile without uninstalling, patch this row in the profile's own cordis.patch.yml:
#
#   - id: wenyuan
#     disabled: true
- insert:
    - id: wenyuan
      name: "wenyuan-coding-agents/dsh"
