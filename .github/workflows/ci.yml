name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: build, test, vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The version go.mod requires, not an older one: with an older Go the
      # toolchain is fetched as a module, and a partial restore of the module
      # cache leaves it without the tools the coverage step needs (the run
      # fails with `no such tool "covdata"` instead of a real result).
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Verify module tidiness
        run: |
          # Fails if go.mod/go.sum are incomplete or need updating, without
          # requiring network access to resolve test-only dependencies.
          go build -mod=readonly ./...
          go vet -mod=readonly ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Vet
        run: go vet ./...

      - name: Build with the pgx driver
        run: go build -tags pgx ./...

      - name: Coverage threshold
        run: make cover-check

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          args: ./...

  postgres:
    name: postgres end-to-end
    runs-on: ubuntu-latest
    # A step rather than a service container: the service's `options` cannot
    # pass the two settings below (in this Docker release `docker create` has no
    # flag for a command), and ParadeDB 0.26.5 needs them the moment a query
    # combines its bm25 scan with the bank_id + fact_type index — without them
    # recall can fail with "bitmap intersection stream ... claimed twice"
    # (paradedb#6403), which makes this job flaky rather than failing outright.
    #
    # The image is the one docker-compose.yml serves: ParadeDB bundles
    # pg_search and pgvector for PostgreSQL 18, and the pg_search keyword-arm
    # test needs the extension's `pdb` schema and its jieba tokenizer, which
    # the pgvector-only image does not have.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Start ParadeDB
        run: |
          docker run -d --name paradedb -p 5432:5432 \
            -e POSTGRES_USER=wenyuan -e POSTGRES_PASSWORD=wenyuan -e POSTGRES_DB=wenyuan_test \
            paradedb/paradedb:0.26.5-pg18 \
            postgres -c paradedb.enable_bitmap_intersection=off -c max_parallel_workers_per_gather=0
          for i in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 5432 -U wenyuan -d wenyuan_test >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "ParadeDB did not become ready:" >&2
          docker logs paradedb >&2
          exit 1

      # The default gate never talks to a database, so the schema, vector and
      # storage code paths are only exercised here. A change can pass
      # build-and-test and still break every one of them.
      - name: Run the PostgreSQL-backed suite
        env:
          PG_TEST_URL: postgresql://wenyuan:wenyuan@127.0.0.1:5432/wenyuan_test
        run: make test-pg

      # The PostgreSQL-backed suite reaches code the offline gate cannot, so its
      # coverage is enforced against its own, higher floor.
      - name: PostgreSQL coverage threshold
        env:
          PG_TEST_URL: postgresql://wenyuan:wenyuan@127.0.0.1:5432/wenyuan_test
        run: make cover-check-pg

  clients:
    name: client SDKs
    runs-on: ubuntu-latest
    steps:
      # The subtree gate below diffs the changed paths against the base
      # revision, so the checkout needs history rather than a single commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # clients/go is a nested module, so the root module's `go test ./...`
      # never reaches it: without this job the SDKs' suites run nowhere in CI
      # and only a developer running `make test-sdk` exercises them. As with
      # the coding-agents job below, the gate is applied here rather than as a
      # workflow-level path filter, which would restrict the Go jobs above too.
      - name: Decide whether the clients changed
        id: gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || ! git rev-parse --verify --quiet "${BASE_SHA}^{commit}" >/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE_SHA" HEAD -- clients scripts/derive_client_spec.py | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # The derived document must match the served one; the SDKs are generated
      # from it, so stale drift here means every client is generated from a
      # contract the service no longer serves.
      - name: Verify the derived spec matches the served document
        if: steps.gate.outputs.changed == 'true'
        run: make clients-check

      - uses: actions/setup-go@v5
        if: steps.gate.outputs.changed == 'true'
        with:
          # go.mod requires 1.25, here and in the nested clients/go module, so
          # the toolchain is installed rather than fetched as a module.
          go-version: "1.25"

      - name: Python SDK suite
        if: steps.gate.outputs.changed == 'true'
        run: |
          python3 -m pip install --quiet -e clients/python pytest pytest-asyncio
          make test-sdk-python

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.changed == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: clients/typescript/package-lock.json

      # The suite type-checks and runs vitest against src/, both of which need
      # the installed toolchain; the target alone assumes node_modules exists.
      - name: Install from the lock file
        if: steps.gate.outputs.changed == 'true'
        run: npm --prefix clients/typescript ci

      - name: TypeScript SDK suite
        if: steps.gate.outputs.changed == 'true'
        run: make test-sdk-typescript

      - name: Rust SDK suite
        if: steps.gate.outputs.changed == 'true'
        run: make test-sdk-rust

      - name: Go SDK suite
        if: steps.gate.outputs.changed == 'true'
        run: make test-sdk-go

  coding-agents:
    name: coding-agents package
    runs-on: ubuntu-latest
    steps:
      # The subtree gate below diffs the changed paths against the base
      # revision, so the checkout needs history rather than a single commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A workflow-level path filter would restrict the Go jobs above as well,
      # so this job gates itself: it runs by default whenever the base revision
      # cannot be resolved, and otherwise only when the package changed.
      - name: Decide whether the package changed
        id: gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || ! git rev-parse --verify --quiet "${BASE_SHA}^{commit}" >/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE_SHA" HEAD -- integrations/coding-agents | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.changed == 'true'
        with:
          # Pinned to the package's declared engines floor (>=22.15: zstd for dsh transcripts).
          node-version: "22"
          cache: npm
          cache-dependency-path: integrations/coding-agents/package-lock.json

      - name: Install from the lock file
        if: steps.gate.outputs.changed == 'true'
        run: npm --prefix integrations/coding-agents ci

      - name: Type-check
        if: steps.gate.outputs.changed == 'true'
        run: npm --prefix integrations/coding-agents run typecheck

      - name: Build
        if: steps.gate.outputs.changed == 'true'
        run: npm --prefix integrations/coding-agents run build

      - name: Unit suite
        if: steps.gate.outputs.changed == 'true'
        run: npm --prefix integrations/coding-agents test