name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: build, test, vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Verify module tidiness
        run: |
          # Fails if go.mod/go.sum are incomplete or need updating, without
          # requiring network access to resolve test-only dependencies.
          go build -mod=readonly ./...
          go vet -mod=readonly ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Vet
        run: go vet ./...

      - name: Build with the pgx driver
        run: go build -tags pgx ./...

      - name: Coverage threshold
        run: make cover-check

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          args: ./...

  postgres:
    name: postgres end-to-end
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: wenyuan
          POSTGRES_PASSWORD: wenyuan
          POSTGRES_DB: wenyuan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wenyuan -d wenyuan_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      # The default gate never talks to a database, so the schema, vector and
      # storage code paths are only exercised here. A change can pass
      # build-and-test and still break every one of them.
      - name: Run the PostgreSQL-backed suite
        env:
          PG_TEST_URL: postgresql://wenyuan:wenyuan@127.0.0.1:5432/wenyuan_test
        run: make test-pg

      # The PostgreSQL-backed suite reaches code the offline gate cannot, so its
      # coverage is enforced against its own, higher floor.
      - name: PostgreSQL coverage threshold
        env:
          PG_TEST_URL: postgresql://wenyuan:wenyuan@127.0.0.1:5432/wenyuan_test
        run: make cover-check-pg

  coding-agents:
    name: coding-agents package
    runs-on: ubuntu-latest
    steps:
      # The subtree gate below diffs the changed paths against the base
      # revision, so the checkout needs history rather than a single commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A workflow-level path filter would restrict the Go jobs above as well,
      # so this job gates itself: it runs by default whenever the base revision
      # cannot be resolved, and otherwise only when the package changed.
      - name: Decide whether the package changed
        id: gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || ! git rev-parse --verify --quiet "${BASE_SHA}^{commit}" >/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE_SHA" HEAD -- integrations/coding-agents | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.changed == 'true'
        with:
          # Pinned to the package's declared engines floor.
          node-version: "20"
          cache: npm
          cache-dependency-path: integrations/coding-agents/package-lock.json

      - name: Install from the lock file
        if: steps.gate.outputs.changed == 'true'
        run: npm --prefix integrations/coding-agents ci

      - name: Type-check
        if: steps.gate.outputs.changed == 'true'
        run: npm --prefix integrations/coding-agents run typecheck

      - name: Build
        if: steps.gate.outputs.changed == 'true'
        run: npm --prefix integrations/coding-agents run build

      - name: Unit suite
        if: steps.gate.outputs.changed == 'true'
        run: npm --prefix integrations/coding-agents test