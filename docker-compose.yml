# Dependency services for a host-run wenyuan: the server, worker and bankctl
# binaries run directly on the host (etc/wenyuan.yaml points at these ports),
# while everything stateful or model-shaped stays in a container.
#
#   postgres       pgvector PostgreSQL, published on 15432 (+10000 over the
#                  reference's own 5432, so the two can run side by side)
#   tei-embedding  HuggingFace Text Embeddings Inference serving
#                  intfloat/multilingual-e5-small (384 dimensions) on 18080
#   tei-reranker   the same TEI image serving BAAI/bge-reranker-base on 18081
#
# First boot downloads the models into the wenyuan-tei-* volumes; subsequent
# boots reuse them. The api service is deliberately absent: the backend is a
# host binary, not an image — point etc/wenyuan.yaml at these ports and run
# `go build -tags pgx ./cmd/server`.

services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: wenyuan
      POSTGRES_PASSWORD: wenyuan
      POSTGRES_DB: wenyuan
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wenyuan -d wenyuan"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      # PG 18+ images manage a versioned data subdirectory, so the mount goes
      # at /var/lib/postgresql, not .../data (see docker-library/postgres#37).
      - wenyuan-pg18:/var/lib/postgresql
    ports:
      - "15432:5432"

  tei-embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8.3
    container_name: wenyuan-tei-embedding
    # Prod-like tuning: high request concurrency with bounded batch sizes.
    command:
      [
        "--model-id", "intfloat/multilingual-e5-small",
        "--max-concurrent-requests", "512",
        "--max-batch-tokens", "16384",
        "--max-client-batch-size", "32",
        "--auto-truncate",
      ]
    environment:
      # TEI listens on port 80 inside the container by default.
      PORT: "80"
    ports:
      # Smoke it directly:
      #   curl 127.0.0.1:18080/embed -H 'content-type: application/json' \
      #        -d '{"inputs":"hello world"}'
      - "18080:80"
    volumes:
      - wenyuan-tei-embedding-cache:/data
    healthcheck:
      # The TEI image ships curl; hit its /health endpoint so dependants only
      # start once the model is loaded and serving.
      test: ["CMD", "curl", "-fsS", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

  tei-reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8.3
    container_name: wenyuan-tei-reranker
    # Reranking batches are larger than embedding batches (rerank inputs are
    # query+document pairs scored in bulk during recall).
    command:
      [
        "--model-id", "BAAI/bge-reranker-base",
        "--max-concurrent-requests", "512",
        "--max-batch-tokens", "32768",
        "--max-client-batch-size", "128",
        "--auto-truncate",
      ]
    environment:
      PORT: "80"
    ports:
      - "18081:80"
    volumes:
      - wenyuan-tei-reranker-cache:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

volumes:
  wenyuan-pg18:
  wenyuan-tei-embedding-cache:
  wenyuan-tei-reranker-cache: