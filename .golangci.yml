# golangci-lint configuration (config schema v2).
# Run with: make lint   (equivalently: golangci-lint run ./...)
# The selected linters match the project's standard-library-first style;
# gofmt and goimports are configured as formatters.
version: "2"

run:
  tests: true

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unconvert
    - unused

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/studyzy/wenyuan